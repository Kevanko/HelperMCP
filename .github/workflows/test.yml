name: test
on: [push, pull_request]
jobs:
  e2e:
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest], node: [18, 22] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
        working-directory: relay
      - run: npm test
        working-directory: relay
