services:
  helpermcp:
    build: .
    restart: unless-stopped
    read_only: true               # the relay writes only to /data (state, encrypted files) and /tmp
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]               # root only to read the root-owned certificate files: no capabilities, no new privileges
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    user: "0"   # only to read root-owned Let's Encrypt keys in TLS_CERT mode; harmless otherwise
    ports: ["${RELAY_BIND:-0.0.0.0}:${RELAY_PORT:-8444}:8444"]
    environment:
      OPERATOR_KEY: ${OPERATOR_KEY:?set OPERATOR_KEY in .env}
      RELAY_PORT: ${RELAY_PORT:-8444}   # only to show it in the console panel
      PUBLIC_URL: ${PUBLIC_URL:-}   # e.g. https://help.example.com
      TLS_CERT: ${TLS_CERT:-}       # optional: serve TLS from your own certbot files, e.g. /certs/live/<domain>/fullchain.pem
      TLS_KEY: ${TLS_KEY:-}
      STATE_FILE: /data/state.json  # sessions + viewer links survive restarts and updates; agents just keep going
    volumes:
      - ${CERTS_DIR:-/etc/letsencrypt}:/certs:ro
      - ./data:/data
  caddy:                            # automatic HTTPS: enabled by COMPOSE_PROFILES=caddy (install.sh --domain)
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [helpermcp]
volumes:
  caddy_data:
