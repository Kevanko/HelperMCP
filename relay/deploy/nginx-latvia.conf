# Include inside the existing TLS virtual host on TCP 443. The host owns the
# certificate and defines $connection_upgrade with the usual HTTP upgrade map.
location = / { absolute_redirect off; return 302 /helper/; }
location = /helper { absolute_redirect off; return 302 /helper/; }
location = /helper/admin { absolute_redirect off; return 302 /admin; }
location = /helper/admin/ { absolute_redirect off; return 302 /admin; }

location ~ ^/(?:mcp$|helper(?:/?$|/health$)|h(?:\.cmd)?$|p(?:\.sh)?$|logo\.svg$|favicon\.(?:svg|ico)$|qr\.svg$|apk(?:/version)?$|admin(?:$|/)|assets/(?:panels\.(?:js|css)|viewer-control\.js)$|(?:a|v|f|s|cursor)/) {
    rewrite ^/helper/?$ / break;
    rewrite ^/helper/health$ /health break;
    client_max_body_size 512m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://127.0.0.1:18444;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
