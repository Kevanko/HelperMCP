# Serve the relay's agent paths on a second, already-open port (the one an existing VPN front listens on, e.g. 9444),
# so a helper still connects when a provider filters 8444. Put these locations inside the existing `server { listen 9444 ssl; ... }`
# of the nginx that holds that port, before its catch-all `location /`. Only the paths a helper needs are exposed.
# Then: nginx -t && nginx -s reload   (a reload keeps running connections).
# The relay trusts X-Forwarded-For only from a local/private peer, so rate limits and "from <ip>" stay per helper.
# Host nginx on the relay machine: use proxy_pass https://127.0.0.1:8444. In a container: the host's address instead.
 location ~ ^/(a/.*|h|h\.cmd|p|health)$ {
  proxy_pass https://127.0.0.1:8444;
  proxy_ssl_server_name on;
  proxy_ssl_name nl-1.leet-prop.ru;      # the relay's certificate name
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_buffering off;                   # the live picture is a long upload, the poll a long wait
  proxy_request_buffering off;
  client_max_body_size 0;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
 }
